<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Create a free EduBright account.">

    <title>Create Account | EduBright</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">

    <a
        href="index.html"
        class="logo">
        EduBright
    </a>


    <div class="nav-actions">

        <a
            href="index.html"
            class="btn btn-outline">
            Home
        </a>

        <a
            href="login.html"
            class="btn btn-primary">
            Login
        </a>

    </div>

</header>


<main class="auth-container">

    <section class="auth-card">

        <h1>
            Create Your Account 🚀
        </h1>

        <p>
            Join EduBright and start learning for free.
        </p>


        <form id="signupForm">

            <label for="name">
                Full Name
            </label>

            <input
                id="name"
                type="text"
                placeholder="Your full name"
                autocomplete="name"
                maxlength="80"
                required
            >


            <label for="email">
                Email
            </label>

            <input
                id="email"
                type="email"
                placeholder="you@example.com"
                autocomplete="email"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                id="password"
                type="password"
                placeholder="At least 6 characters"
                autocomplete="new-password"
                minlength="6"
                required
            >


            <label for="confirmPassword">
                Confirm Password
            </label>

            <input
                id="confirmPassword"
                type="password"
                placeholder="Enter your password again"
                autocomplete="new-password"
                minlength="6"
                required
            >


            <button
                id="signupBtn"
                type="submit">

                Create Account

            </button>

        </form>


        <p
            id="signupMessage"
            role="alert">
        </p>


        <p class="auth-link">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>


        <p class="auth-link">

            <a href="index.html">
                ← Back to EduBright
            </a>

        </p>

    </section>

</main>


<script
    type="module"
    src="signup.js">
</script>

</body>

</html>
