<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Explore free courses on EduBright.">

    <title>Courses | EduBright</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">

    <a
        href="index.html"
        class="logo">
        EduBright
    </a>


    <nav class="nav-links">

        <a href="index.html">
            Home
        </a>

        <a href="courses.html">
            Courses
        </a>

        <a href="dashboard.html">
            Dashboard
        </a>

    </nav>


    <div class="nav-actions">

        <a
            href="login.html"
            class="btn btn-outline">
            Login
        </a>

        <a
            href="signup.html"
            class="btn btn-primary">
            Sign Up
        </a>

    </div>

</header>


<main>

    <section class="section">

        <div class="section-heading">

            <span>
                Learn Something New
            </span>

            <h1>
                Explore Courses
            </h1>

            <p>
                Learn practical skills through
                free lessons and projects.
            </p>

        </div>


        <!-- Search -->

        <div
            style="
                max-width:700px;
                margin:0 auto 35px;
            ">

            <input
                id="courseSearch"
                type="search"
                placeholder="Search courses..."
                style="
                    width:100%;
                    padding:15px;
                    border:1px solid #e5e7eb;
                    border-radius:12px;
                    outline:none;
                "
            >

        </div>


        <!-- Categories -->

        <div
            id="categoryFilters"
            style="
                display:flex;
                justify-content:center;
                gap:10px;
                flex-wrap:wrap;
                margin-bottom:35px;
            ">

            <button
                class="btn btn-primary category-btn"
                data-category="all">

                All

            </button>

            <button
                class="btn btn-outline category-btn"
                data-category="programming">

                Programming

            </button>

            <button
                class="btn btn-outline category-btn"
                data-category="web">

                Web Development

            </button>

            <button
                class="btn btn-outline category-btn"
                data-category="cybersecurity">

                Cybersecurity

            </button>

            <button
                class="btn btn-outline category-btn"
                data-category="design">

                Design

            </button>

        </div>


        <!-- Courses -->

        <div
            id="coursesGrid"
            class="course-grid">

            <div class="loading-card">

                Loading courses...

            </div>

        </div>

    </section>

</main>


<footer class="footer">

    <div class="footer-main">

        <div>

            <a
                href="index.html"
                class="logo">
                EduBright
            </a>

            <p>
                Free education.
                Better opportunities.
            </p>

        </div>


        <div class="footer-links">

            <a href="index.html">
                Home
            </a>

            <a href="privacy.html">
                Privacy
            </a>

            <a href="terms.html">
                Terms
            </a>

        </div>

    </div>


    <div class="footer-bottom">

        © 2026 EduBright.
        All rights reserved.

    </div>

</footer>


<script
    type="module"
    src="courses.js">
</script>

</body>

</html>
